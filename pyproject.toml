[project]
name = "sawy-insights"
version = "0.1.0"
description = "Visibilidad de negocio a partir de exports de ERP: modelo canónico + hallazgos + IA."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # el formatter maneja el largo; los textos en español se dejan enteros
